[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mixture-of-scars"
version = "1.2.0"
description = "Mixture of Scars (MoS) & SCache: Radical Static Weight Compression & O(1) Constant Memory KV-Cache Replacement for LLMs"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Julio Cesar Reis Filho" }
]
keywords = [
    "llm",
    "kv-cache",
    "mixture-of-experts",
    "moe",
    "mixture-of-scars",
    "transformers",
    "fast-weights",
    "hebbian-learning",
    "pytorch",
    "huggingface"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "safetensors>=0.4.0",
    "transformers>=4.45.0",
]

[project.scripts]
mos-run = "scar_cache.cli_72b:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "transformers>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scar_cache*", "mixture_of_scars*"]
